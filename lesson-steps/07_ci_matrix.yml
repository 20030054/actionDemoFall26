# ===================================================================
# BONUS STEP 7 - Test on many versions at once (a MATRIX)
# Copy this file OVER:  .github/workflows/ci.yml  (replace step 3)
# ===================================================================
#
# One job definition -> many jobs, running IN PARALLEL.
# 3 Python versions x 2 operating systems = 6 jobs.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Each job gets a readable name, e.g. "Python 3.13 on ubuntu-latest"
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    # The runner is now chosen by the matrix.
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the tests
        run: pytest -v
